<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
<style>
:root { --pink1:#F7A9BF; --pink2:#E9799A; --ink:#3D3437; --bg:#FFF6F8; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; line-height:1.8; }
.hero { background:linear-gradient(135deg,var(--pink1),var(--pink2)); color:#fff; padding:40px 20px 36px; text-align:center; }
.hero img.usagi { width:96px; height:96px; border-radius:50%; border:3px solid rgba(255,255,255,.8); }
.hero h1 { margin:12px 0 4px; font-size:28px; letter-spacing:.04em; }
.hero .sub { margin:0; font-size:16px; }
.hero .note { margin:10px 0 0; font-size:13px; opacity:.95; }
main { max-width:720px; margin:0 auto; padding:24px 16px 48px; }
.card { background:#fff; border-radius:20px; padding:20px; margin:0 0 20px; box-shadow:0 4px 16px rgba(233,121,154,.15); }
.card-head { display:flex; align-items:center; gap:14px; }
.card-head img { width:64px; height:64px; border-radius:14px; }
.card h2 { margin:0; font-size:20px; }
.card p { margin:12px 0 16px; }
.btn { display:inline-block; align-self:flex-start; text-align:center; background:linear-gradient(135deg,var(--pink1),var(--pink2)); color:#fff !important; text-decoration:none; font-weight:bold; padding:12px 28px; border-radius:999px; }
h2.sec { font-size:18px; margin:32px 0 8px; }
main ul { padding-left:20px; }
main a { color:#C94A74; }
hr { border:0; border-top:1px solid #F0D5DC; margin:28px 0 16px; }
.caution { font-size:13px; }
@media (min-width:768px) { .cards { display:grid; grid-template-columns:1fr 1fr; gap:20px; } .cards .card { margin:0; display:flex; flex-direction:column; } .cards .card p { flex:1; } .hero h1 { font-size:36px; } }
</style>
{% if site.ga4_id %}
<!-- GA4：一覧ページの閲覧数とストアへのボタン押下を数える（_config.yml の ga4_id が空なら出力しない） -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.ga4_id }}"></script>
<script>
window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}
gtag('js',new Date());gtag('config','{{ site.ga4_id }}');
</script>
{% endif %}
</head>
<body>
{{ content }}
</body>
</html>
